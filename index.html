<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Buntes Glücksrad</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffe6f7, #e0f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #222;
    }

    .app {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      padding: 24px 24px 30px;
      display: flex;
      gap: 24px;
      max-width: 1000px;
      width: 95%;
      align-items: flex-start;
    }

    @media (max-width: 800px) {
      .app {
        flex-direction: column;
        align-items: center;
      }
    }

    .left, .right {
      flex: 1;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.8rem;
    }

    .subtitle {
      margin-bottom: 16px;
      color: #555;
      font-size: 0.9rem;
    }

    .wheel-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 20px;
    }

    #wheel {
      border-radius: 50%;
      max-width: 100%;
      height: auto;
      background: #fff;
    }

    /* Pfeil – Spitze nach unten aufs Rad */
    .pointer {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 30px solid #ff3366; /* Spitze nach unten */
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
      z-index: 10;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .hint {
      font-size: 0.8rem;
      color: #777;
      margin: 4px 0 10px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
      white-space: nowrap;
    }

    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5f6d, #ffc371);
      color: #fff;
      box-shadow: 0 6px 16px rgba(255, 95, 109, 0.4);
      font-weight: 600;
    }

    .btn-primary:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f2f2f7;
      color: #333;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid #ddd;
      color: #555;
    }

    .status {
      font-size: 0.85rem;
      color: #555;
      margin-top: 6px;
      min-height: 1.2em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #eef8ff;
      color: #246;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }

    .option-row {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #444;
    }

    .option-row input {
      margin-right: 6px;
    }

    /* Winner Modal */
    .winner-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000000; /* unter Konfetti-Canvas */
    }

    .winner-modal.show {
      display: flex;
    }

    .winner-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 28px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 14px 35px rgba(0,0,0,0.25);
      animation: pop 0.4s ease-out;
    }

    @keyframes pop {
      0%   { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .winner-title {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 8px;
    }

    .winner-name {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(120deg, #ff3366, #ffcc00, #33ccff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .winner-sub {
      font-size: 0.9rem;
      color: #777;
      margin-bottom: 16px;
    }

    .btn-close {
      margin-top: 4px;
    }

    /* Konfetti-Canvas ganz vorne */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000000;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="left">
      <h1>Glücksrad Moderationsübergabe</h1>
      <div class="subtitle">Namen eintragen, speichern und drehen</div>
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="420" height="420"></canvas>
      </div>
    </div>

    <div class="right">
      <div class="badge">💾 Speichert automatisch in deinem Browser</div>

      <label for="names">Namen (je Zeile ein Name):</label>
      <textarea id="names" placeholder="Max&#10;Anna&#10;Sven&#10;..."></textarea>

      <div class="option-row">
        <label>
          <input type="checkbox" id="removeWinnerCheckbox" />
          Gewinner nach dem Drehen aus der Liste entfernen
        </label>
      </div>

      <div class="button-row">
        <button id="updateWheelBtn" class="btn-secondary" type="button">Rad aktualisieren</button>
        <button id="saveBtn" class="btn-secondary" type="button">Namen speichern</button>
        <button id="loadBtn" class="btn-ghost" type="button">Gespeicherte laden</button>
        <button id="clearBtn" class="btn-ghost" type="button">Liste leeren</button>
      </div>

      <div class="button-row">
        <button id="spinBtn" class="btn-primary" type="button">
          🎡 Drehen
        </button>
      </div>

      <div class="status" id="statusText"></div>
    </div>
  </div>

  <!-- Konfetti-Canvas ganz vorne -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Konfetti-Bibliothek -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    const namesTextarea = document.getElementById('names');
    const updateWheelBtn = document.getElementById('updateWheelBtn');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const spinBtn = document.getElementById('spinBtn');
    const statusText = document.getElementById('statusText');
    const removeWinnerCheckbox = document.getElementById('removeWinnerCheckbox');

    const STORAGE_KEY = 'gluecksrad_namen_v5';

    let names = ['Jurek', 'Kai', 'Finn', 'André','Jan','Benjamin','Nina','Saskia'];
    let rotation = 0;       // aktuelle Rotation in Radiant
    let spinVelocity = 0;   // Drehgeschwindigkeit
    let isSpinning = false;

    // ---------- Konfetti (Vordergrund) ----------
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiInstance = confetti.create(confettiCanvas, {
      resize: true,
      useWorker: true
    });

    function fireConfetti() {
      const duration = 1200;
      const end = Date.now() + duration;

      (function frame() {
        confettiInstance({
          particleCount: 40,
          spread: 60,
          origin: { x: Math.random(), y: 0.2 },
          scalar: 0.9
        });
        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    // ---------- Hilfsfunktionen Namen ----------
    function parseNamesFromTextarea() {
      return namesTextarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);
    }

    function updateNamesFromTextarea() {
      const currentNames = parseNamesFromTextarea();
      if (currentNames.length === 0) {
        statusText.textContent = 'Bitte trage mindestens einen Namen ein.';
        names = [];
      } else {
        names = currentNames;
        statusText.textContent = 'Rad aktualisiert mit ' + names.length + ' Namen.';
      }
      rotation = 0;
      drawWheel();
      updateSpinButtonState();
    }

    function saveNames() {
      const currentNames = parseNamesFromTextarea();
      if (currentNames.length === 0) {
        statusText.textContent = 'Keine Namen zum Speichern gefunden.';
        return;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentNames));
      statusText.textContent = 'Namen gespeichert ✅';
    }

    function loadNames() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) {
        statusText.textContent = 'Keine gespeicherten Namen gefunden.';
        return;
      }
      try {
        const loaded = JSON.parse(data);
        if (Array.isArray(loaded) && loaded.length > 0) {
          names = loaded;
          namesTextarea.value = loaded.join('\n');
          rotation = 0;
          drawWheel();
          updateSpinButtonState();
          statusText.textContent = 'Gespeicherte Namen geladen.';
        } else {
          statusText.textContent = 'Gespeicherte Daten sind leer oder ungültig.';
        }
      } catch (e) {
        console.error(e);
        statusText.textContent = 'Fehler beim Laden der Namen.';
      }
    }

    function updateSpinButtonState() {
      spinBtn.disabled = names.length === 0;
    }

    // ---------- Zeichnen des Rades ----------
    function randomBrightColor(index, total) {
      const hue = (index / total) * 360;
      return `hsl(${hue}, 80%, 55%)`;
    }

    function drawWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(w, h) / 2 - 10;

      ctx.clearRect(0, 0, w, h);

      if (names.length === 0) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#bbb';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Keine Namen', 0, 0);
        ctx.restore();
        return;
      }

      const sliceAngle = (Math.PI * 2) / names.length;

      ctx.save();
      ctx.translate(cx, cy);

      rotation = rotation % (Math.PI * 2);

      for (let i = 0; i < names.length; i++) {
        const startAngle = -Math.PI / 2 + rotation + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle, false);
        ctx.closePath();
        ctx.fillStyle = randomBrightColor(i, names.length);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();

        const midAngle = startAngle + sliceAngle / 2;
        ctx.save();
        ctx.rotate(midAngle);
        ctx.translate(radius * 0.65, 0);
        ctx.rotate(Math.PI / 2);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let name = names[i];
        if (name.length > 16) name = name.slice(0, 13) + '…';
        ctx.fillText(name, 0, 0);

        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    // ---------- Gewinner-Berechnung ----------
    function getWinningIndex() {
      if (names.length === 0) return -1;

      const sliceAngle = (Math.PI * 2) / names.length;

      let rot = rotation % (Math.PI * 2);
      if (rot < 0) rot += Math.PI * 2;

      let relativeAngle = -rot;
      relativeAngle = relativeAngle % (Math.PI * 2);
      if (relativeAngle < 0) relativeAngle += Math.PI * 2;

      const index = Math.floor(relativeAngle / sliceAngle);
      return index;
    }

    // ---------- Winner-Modal ----------
    const modal = document.createElement('div');
    modal.className = 'winner-modal';
    modal.innerHTML = `
      <div class="winner-card">
        <div class="winner-title">Gewinner/in</div>
        <div class="winner-name" id="winnerName">–</div>
        <div class="winner-sub">Herzlichen Glückwunsch! 🎉</div>
        <button class="btn-secondary btn-close" type="button">Schließen</button>
      </div>
    `;
    document.body.appendChild(modal);
    const winnerNameSpan = modal.querySelector('#winnerName');
    const closeBtn = modal.querySelector('.btn-close');

    function showWinner(name) {
      winnerNameSpan.textContent = name || '–';
      modal.classList.add('show');
      fireConfetti();
    }

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('show');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('show');
    });

    // ---------- Animation / Drehung ----------
    function animateSpin() {
      if (!isSpinning) return;

      rotation += spinVelocity;
      spinVelocity *= 0.985; // Reibung

      drawWheel();

      if (spinVelocity < 0.002) {
        isSpinning = false;
        spinVelocity = 0;

        // Gewinner bestimmen bevor wir ggf. die Liste ändern
        const index = getWinningIndex();
        const winner = names[index] || '–';

        // Gewinner entfernen, wenn Checkbox aktiv
        if (removeWinnerCheckbox.checked && index >= 0 && names.length > 0) {
          names.splice(index, 1);
          namesTextarea.value = names.join('\n');
        }

        drawWheel();

        statusText.textContent = 'Gewinner/in: ' + winner;
        showWinner(winner);
        updateSpinButtonState();
        return;
      }

      requestAnimationFrame(animateSpin);
    }

    function startSpin() {
      if (isSpinning) return;
      if (names.length === 0) {
        statusText.textContent = 'Bitte zuerst Namen eintragen.';
        return;
      }
      isSpinning = true;
      statusText.textContent = 'Das Rad dreht...';
      spinVelocity = 0.25 + Math.random() * 0.25;
      updateSpinButtonState();
      animateSpin();
    }

    // ---------- Events ----------
    updateWheelBtn.addEventListener('click', updateNamesFromTextarea);
    saveBtn.addEventListener('click', saveNames);
    loadBtn.addEventListener('click', loadNames);
    clearBtn.addEventListener('click', () => {
      namesTextarea.value = '';
      names = [];
      rotation = 0;
      drawWheel();
      updateSpinButtonState();
      statusText.textContent = 'Liste geleert.';
    });
    spinBtn.addEventListener('click', startSpin);

    namesTextarea.addEventListener('input', () => {
      statusText.textContent = '';
    });

    // ---------- Initialisierung ----------
    (function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const loaded = JSON.parse(saved);
          if (Array.isArray(loaded) && loaded.length > 0) {
            names = loaded;
            namesTextarea.value = loaded.join('\n');
            statusText.textContent = 'Gespeicherte Namen automatisch geladen.';
          }
        } catch (e) {
          console.warn('Konnte gespeicherte Namen nicht lesen:', e);
        }
      } else {
        namesTextarea.value = names.join('\n');
      }
      updateSpinButtonState();
      drawWheel();
    })();
  </script>
</body>
</html>
