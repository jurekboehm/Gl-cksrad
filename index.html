<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Buntes Glücksrad</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffe6f7, #e0f7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #222;
    }

    .app {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      padding: 24px 24px 30px;
      display: flex;
      gap: 24px;
      max-width: 1000px;
      width: 95%;
      align-items: flex-start;
    }

    @media (max-width: 800px) {
      .app { flex-direction: column; align-items: center; }
    }

    .left, .right { flex: 1; }

    h1 { margin: 0 0 4px; font-size: 1.8rem; }

    .subtitle {
      margin-bottom: 16px;
      color: #555;
      font-size: 0.9rem;
    }

    .wheel-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 20px;
    }

    #wheel { border-radius: 50%; background: #fff; }

    .pointer {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 30px solid #ff3366;
      z-index: 10;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5f6d, #ffc371);
      color: #fff;
      font-weight: 600;
    }

    .btn-secondary { background: #f2f2f7; }
    .btn-ghost { background: transparent; border: 1px solid #ddd; }

    .winner-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .winner-modal.show { display: flex; }

    .winner-card {
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000;
    }
  </style>
</head>

<body>
<div class="app">
  <div class="left">
    <h1>Glücksrad Moderationsübergabe</h1>
    <div class="subtitle">Namen eintragen, speichern und drehen</div>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="420" height="420"></canvas>
    </div>
  </div>

  <div class="right">
    <textarea id="names"></textarea><br><br>
    <label><input type="checkbox" id="removeWinnerCheckbox"> Gewinner entfernen</label><br><br>

    <button class="btn-secondary" id="updateWheelBtn">Rad aktualisieren</button>
    <button class="btn-secondary" id="saveBtn">Speichern</button>
    <button class="btn-primary" id="spinBtn">🎡 Drehen</button>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.0/dist/confetti.browser.min.js"></script>

<script>
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');

  const namesTextarea = document.getElementById('names');
  const spinBtn = document.getElementById('spinBtn');
  const removeWinnerCheckbox = document.getElementById('removeWinnerCheckbox');

  let names = ['Jurek','Kai','Finn','André','Jan','Benjamin','Nina','Saskia'];
  let rotation = 0;
  let speed = 0;
  let spinning = false;

  // ==============================
  // 🔒 VERSTECKTE GEWINNGEWICHTE
  // ==============================
  const nameWeights = {
    'Jurek': 3,
    'Benjamin': 2,
    'Nina': 1,
    'Saskia': 1
  };
  // nicht genannte Namen => Gewicht 1

  function getWeightedWinnerIndex() {
    const weights = names.map(n => nameWeights[n] ?? 1);
    const total = weights.reduce((a,b) => a+b, 0);
    let rnd = Math.random() * total;

    for (let i = 0; i < weights.length; i++) {
      rnd -= weights[i];
      if (rnd <= 0) return i;
    }
    return 0;
  }

  function drawWheel() {
    ctx.clearRect(0,0,420,420);
    const slice = Math.PI * 2 / names.length;

    ctx.save();
    ctx.translate(210,210);
    for (let i=0;i<names.length;i++) {
      ctx.beginPath();
      ctx.fillStyle = `hsl(${i/names.length*360},80%,55%)`;
      ctx.moveTo(0,0);
      ctx.arc(0,0,190,rotation+i*slice,rotation+(i+1)*slice);
      ctx.fill();

      ctx.rotate(slice/2);
      ctx.textAlign="right";
      ctx.fillStyle="#fff";
      ctx.font="16px system-ui";
      ctx.fillText(names[i],180,5);
      ctx.rotate(-slice/2);
    }
    ctx.restore();
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    speed = 0.3 + Math.random()*0.3;

    function anim() {
      rotation += speed;
      speed *= 0.985;
      drawWheel();

      if (speed < 0.003) {
        spinning = false;
        const index = getWeightedWinnerIndex();
        const winner = names[index];

        alert('Gewinner: ' + winner);

        if (removeWinnerCheckbox.checked) {
          names.splice(index,1);
          namesTextarea.value = names.join('\n');
        }

        drawWheel();
        return;
      }
      requestAnimationFrame(anim);
    }
    anim();
  }

  document.getElementById('updateWheelBtn').onclick = () => {
    names = namesTextarea.value.split('\n').map(n=>n.trim()).filter(Boolean);
    drawWheel();
  };

  document.getElementById('saveBtn').onclick = () =>
    localStorage.setItem('rad', JSON.stringify(names));

  spinBtn.onclick = spin;

  // init
  const saved = JSON.parse(localStorage.getItem('rad')||'null');
  if (saved) names = saved;
  namesTextarea.value = names.join('\n');
  drawWheel();
</script>
</body>
</html>
